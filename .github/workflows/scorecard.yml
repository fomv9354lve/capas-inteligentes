# Tier 3 — OpenSSF Scorecard: an INDEPENDENT supply-chain security score for the open core.
# Publishes to the public OpenSSF dashboard so the badge reflects a third party's assessment, not ours.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0 (image moved gcr.io -> ghcr.io; gcr pull now demands billing)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true   # publishes to the public OpenSSF API (enables the badge)

      - name: Upload SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: SARIF-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357  # v3
        with:
          sarif_file: results.sarif
