name: CAPAS CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege token (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  product-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Install package
        run: |
          python -m pip install -e .
          python -m pip install pytest   # PLAN_v3 ledger backings and the mutated-trace suite run under pytest

      - name: Product demo acceptance
        run: python benchmarks/verify_capas_product_demo.py

      - name: Fresh clone install smoke
        run: python benchmarks/verify_fresh_clone_install.py

      - name: External input schema
        run: python benchmarks/verify_external_input_schema.py

      - name: Claim gate UI
        run: python benchmarks/verify_claim_gate_ui.py

      - name: External user validation packet
        run: python benchmarks/verify_external_user_validation.py

      # The hand-authored benchmark page must carry exactly the counts of outputs/family_decision_mix.json (stale on 2026-10-13).
      - name: Benchmark page matches its data file
        run: python benchmarks/verify_benchmark_page_matches_mix.py

      # Every CLOSED/BACKED/SCOPED line on in-depth.html sits under the status the proof ledger gives it.
      - name: In-depth page matches the proof ledger
        run: python benchmarks/verify_page_matches_ledger.py

      # Wording the external audit flagged can never return (a fix without a test escapes).
      - name: Site wording guard
        run: python benchmarks/verify_site_wording.py

      # Professional register (owner 2026-10-14): no em-dashes, question headlines, exclamations or self-praise.
      - name: Site register guard
        run: python benchmarks/verify_site_register.py

      # The brief's decision packet is engine output, embedded verbatim (external audit 2026-10-14).
      - name: Brief decision packet matches the engine
        run: python benchmarks/verify_brief_packet_matches_engine.py

      # Load-bearing invariants on neutral CI (deterministic, no browser / gh / release deps).
      - name: Conformance suite
        run: python benchmarks/conformance.py

      # Blind-corpus figures re-derived from the public redacted files, and every sealed verdict replayed with the
      # engine at its frozen tag (owner decision 2026-10-14: verdicts and outcome labels public, claim text as hash).
      # PLAN_v3 (owner 2026-10-14, "implementa las 9"): rules as data, independent checker, mutated traces, co-signed prereg
      - name: Rule table regenerates from the engine
        run: python scripts/gen_rule_table.py --check

      - name: Rule table replays every recorded decision
        run: python scripts/check_rule_table.py

      - name: Certificate fixtures in sync and accepted by the independent checker
        run: |
          python scripts/make_certificate_fixtures.py --check
          python capas_check.py --table docs/rule_table.json research/certificates/fixtures.jsonl | tail -1

      - name: Checker rejects every mutated trace; PLAN_v3 engine rules; pharma validator adapter
        run: python -m pytest -q benchmarks/test_capas_check_mutations.py benchmarks/test_plan3_rules.py benchmarks/test_pharma_validator.py

      - name: Coder agreement re-derives; X6 pre-registration is the co-signed version
        run: |
          python research/ginibre_corpus/coder_agreement_retro.py --public
          python research/x6_prereg/check_cosign.py

      - name: Home reference decisions show the engine's audit hashes
        run: python benchmarks/home_gate_decisions.py --check

      - name: Site navigation matches its single source
        run: python scripts/apply_nav.py --check

      - name: Blind corpus re-derived from the public files
        run: |
          git fetch --no-tags --depth=1 origin 'refs/tags/ginibre-ciego-*:refs/tags/ginibre-ciego-*'
          python research/ginibre_corpus/score_public.py --replay --json

      # Locks the gate's correctness on the two failure modes the pedagogy sprint flagged
      # (non-GIGO false-admit + over-block): a real regression fails CI. GIGO ceiling is out of scope.
      - name: Gate correctness (no false-admit / no over-block)
        run: python benchmarks/verify_gate_no_false_admit.py

      # Exercises the shipped engine across all 12 claim types + the verify/audit surface
      # (raises real coverage of the load-bearing decision paths).
      - name: Engine surface (12 claim types + verify)
        run: python benchmarks/test_engine_surface.py

      # Per-stratum deep suites + capas.py decide/contract/certificate/research slices — exercise every
      # engine layer with valid inputs. Real coverage of the shipped core crosses 80% (statement).
      - name: Engine deep coverage suites
        run: |
          for t in benchmarks/test_*deep.py benchmarks/test_capas_*.py; do python "$t"; done

      # OpenSSF Best Practices — warnings: treated as errors (verified clean on the conformance suite).
      - name: Warnings as errors
        run: python -W error benchmarks/conformance.py

      # OpenSSF Best Practices — dynamic_analysis: property-based fuzzing. The gate must fail-closed and
      # never crash on any generated input (generalizes verify_robustness.py via Hypothesis).
      - name: Dynamic analysis (Hypothesis fuzz)
        run: |
          python -m pip install hypothesis
          python benchmarks/test_dynamic_fuzz.py

      # OpenSSF Best Practices — static_analysis: Python security linter (reporting; CodeQL semantic
      # analysis runs in codeql.yml). --exit-zero keeps it non-blocking until findings are triaged.
      - name: Static analysis (Bandit)
        run: |
          python -m pip install bandit
          bandit -r . -ll --exit-zero -x ./outputs,./.pixi,./designlab/vendor,./docs/vendor,./build

      # OpenSSF Best Practices (Silver) — coding_standards_enforced: Ruff lint. ENFORCING on the
      # real-error subset (E9/F63/F7/F82 per pyproject); the broader style sweep is reported, non-blocking.
      - name: Lint (Ruff)
        run: |
          python -m pip install ruff
          ruff check .                                 # enforcing: fails on real errors
          ruff check . --select=ALL --exit-zero --statistics   # full style report (non-blocking)

      - name: Entry point smoke test
        run: capas inspect trace_039

      # OpenSSF Best Practices — test coverage: run the conformance suite under coverage and PRINT the
      # real measured statement %. Non-blocking (no threshold gate). The suite runs each invariant check
      # as a subprocess, so we enable subprocess coverage via COVERAGE_PROCESS_START + a process_startup
      # hook on PYTHONPATH, then combine. We report the honest number; we do not gate on it.
      - name: Coverage (measured, non-blocking)
        continue-on-error: true
        run: |
          python -m pip install coverage
          mkdir -p .covhook
          cat > .covhook/sitecustomize.py <<'PY'
          import coverage
          coverage.process_startup()
          PY
          cat > .coveragerc <<'CFG'
          [run]
          parallel = true
          source = .
          omit =
              benchmarks/*
              outputs/*
              designlab/*
              build/*
              dist/*
              .pixi/*
              docs/*
              tests/*
              examples/*
              setup.py
          CFG
          rm -f .coverage .coverage.* || true
          COVERAGE_PROCESS_START="$PWD/.coveragerc" \
          PYTHONPATH="$PWD/.covhook:$PYTHONPATH" \
          python -m coverage run --rcfile=.coveragerc benchmarks/conformance.py
          python -m coverage combine --rcfile=.coveragerc || true
          echo "=== CAPAS measured statement coverage (conformance suite, non-blocking) ==="
          python -m coverage report --rcfile=.coveragerc

      # OpenSSF Best Practices — SCA (Software Composition Analysis): scan installed deps for known
      # vulnerabilities. Reporting-only (|| true) so a transitive advisory does not red-flag every push.
      - name: Dependency audit (pip-audit, reporting)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit || true

      # NOTE: "External MVP readiness packets" (verify_external_mvp_readiness.py — asserts gh-auth +
      # release tags) and the full "Product validators" (`capas validate` — browser E2E + env-sensitive)
      # were removed from per-push CI: they assume a local/release environment that a runner does not
      # have and flaked red on every commit (the email flood). Release readiness belongs in a release
      # workflow; the validate invariants are covered by the conformance suite above. Run them locally:
      # `python capas.py validate`.

  # External re-audit fb52d8c: the Gate App's integrity regressions run in a real browser against the local engine,
  # with the page's CSP active. A failure fails the build (no continue-on-error, no skip).
  browser-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install package, Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Gate App contract (A-J)
        run: python benchmarks/verify_gate_app_contract.py

      - name: Gate App integrity (round 5)
        run: python benchmarks/verify_gate_app_integrity.py
