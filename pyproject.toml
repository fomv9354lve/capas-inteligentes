[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capas-claim-gate"
version = "0.4.1"
description = "A fail-closed verification layer you wrap around your LLM: it never lets an unsupported claim through as ACCEPT, re-derives what is re-derivable, and emits a deterministic verifiable reward."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "CAPAS project" }
]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "scipy",   # load-bearing since 2026-10-13: p-value recomputation and joint chi2 criteria (the engine HOLDs without it, never fails open)
]

[project.urls]
Homepage = "https://capas.krenniq.com/"
Repository = "https://github.com/fomv9354lve/capas-inteligentes"
"Proof ledger" = "https://capas.krenniq.com/proof_ledger.json"
"Release notes" = "https://github.com/fomv9354lve/capas-inteligentes/blob/main/RELEASE_NOTES_0.4.0.md"

[project.optional-dependencies]
# G-CLOSED (rmt_G for gamma > 1, state reduced) evaluates a symbolic closed form; without sympy the gate HOLDs, never errors
rmt = ["sympy"]
# capas_ingest.backend_properties reads Qiskit BackendProperties (object or JSON); the JSON path needs nothing extra
ingest = ["qiskit-ibm-runtime"]
corpus = [
  "scipy",
  "pyscf",
  "quimb",
  "cotengra",
  "stim",
  "rocrate==0.15.0",
  "rocrateValidator==0.2.15",
]
validation = [
  "rocrate==0.15.0",
  "rocrateValidator==0.2.15",
]
standalone = [
  "pypdf>=4",
]

[project.scripts]
capas = "capas:main"
capas-mcp = "capas_mcp:serve"

[tool.setuptools]
# LEAN ENGINE: ship only the deterministic gate core. The research layer
# (falsify/discovery/sequential/bridge/consilience/cognitive) stays in the repo,
# importable from source, but is NOT in the wheel.
#   capas_invariants     — REQUIRED: the invariant override runs on EVERY decide_external_claim
#   capas_quantum_physics — the quantum gate (capas_sdk.gate_quantum) + quantum invariant block
#   capas_mcp            — the MCP server surface (capas-mcp entry point)
py-modules = [
  "capas", "capas_sdk", "capas_verify", "capas_admissibility", "capas_rcc",
  "capas_route", "capas_intake", "capas_propose",
  "capas_invariants", "capas_quantum_physics", "capas_mcp",
  # imported directly by capas.py since 2026-09 (pip-package verifier caught the gap 2026-10-13)
  "capas_breeding", "capas_independence",
  # third pole: the survive-refutation ledger (gate <-> accountability-over-time integration)
  "capas_ledger_store", "capas_ledger", "capas_registry", "capas_trust",
  # PLAN_v3 (2026-10-14): downgrade-only stages inside decide() and the rule table as data (certificate trace)
  "capas_plan3", "capas_rules",
]
packages = ["router", "router.backends", "integrations"]

[tool.ruff]
target-version = "py311"
exclude = ["outputs", "designlab", "build", "dist", ".pixi", "docs/vendor"]

[tool.ruff.lint]
# Enforced subset: syntax errors + undefined/duplicate/forward-ref names — real bugs a
# working tree passes. Broader style is reported in CI (non-blocking) until triaged.
# Backs OpenSSF Best Practices Silver: coding_standards / coding_standards_enforced.
select = ["E9", "F63", "F7", "F82"]
