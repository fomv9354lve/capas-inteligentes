name: CAPAS Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
        with:
          enablement: true

      # The pages link GOVERNANCE.md, SECURITY.md, CERTIFICATION.md, LICENSE and THIRD_PARTY_NOTICES.md (repo root);
      # copy them into the artifact so the Pages build resolves its own links (external audit 2026-10-14).
      - name: Include root documents linked from the pages
        run: cp GOVERNANCE.md SECURITY.md CERTIFICATION.md LICENSE THIRD_PARTY_NOTICES.md docs/

      - name: Upload static demo
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
