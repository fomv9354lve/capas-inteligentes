name: CAPAS Claim Gate Action

on:
  workflow_dispatch:

# Least-privilege token (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

jobs:
  claim-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/capas-claim-gate
        with:
          mode: batch
          input: examples/external_claim_batch.json
          output: outputs/capas-action-report.json
      - name: Upload CAPAS report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: capas-claim-gate-report
          path: outputs/capas-action-report.json
